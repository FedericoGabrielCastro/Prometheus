[project]
name = "prometheus"
version = "0.1.0"
description = "Python Agent Runner + tools"
authors = [
    {name = "Federico Gabriel Castro"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = []

[tool.poetry]
packages = [{include = "prometheus", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
